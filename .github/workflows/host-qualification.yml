name: Separate-account host qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'core/guardhost/**'
      - 'core/guardsigner/**'
      - 'core/guardapproval/**'
      - 'cmd/adk-signer/**'
      - 'cmd/adk-approve/**'
      - '.github/workflows/host-qualification.yml'

permissions:
  contents: read

concurrency:
  group: host-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Separate-account 2+3 qualification (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - name: Build static binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for c in ./cmd/adk-signer ./cmd/adk-approve ./core/guardhost/testdata/qualification; do
            CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/bin/$(basename "$c")" "$c"
          done
          sha256sum "$RUNNER_TEMP"/bin/*
      - name: Run signers, receiver and caller as separate accounts
        run: sh core/guardhost/testdata/qualification/run-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/qualification.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification-log
          path: ${{ runner.temp }}/qualification.log
          if-no-files-found: ignore
