name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            verification/library-consumer/go.sum
      - name: Verify dependencies and build
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
      - name: Unit and safe loopback tests
        run: go test -mod=readonly -race -timeout 10m ./...
      - name: Diagnose fixed native hop refusals
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python3 scripts/trace-native-hop.py
      - name: Approved operation policy coverage
        run: |
          go test -mod=readonly -race -coverpkg=./core/guardbinding -coverprofile="$RUNNER_TEMP/approved-operation.cover" -timeout 2m ./core/guardbinding ./core/toolhost
          go tool cover -func="$RUNNER_TEMP/approved-operation.cover" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Compiled calculator binding coverage
        run: |
          go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/calculator-binding.cover" ./core/guardcalculator
          go tool cover -func="$RUNNER_TEMP/calculator-binding.cover" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 85) exit 1 } END { if (!found) exit 1 }'
      - name: External library consumer
        working-directory: verification/library-consumer
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly -race -timeout 1m ./...
      - name: CLI smoke check
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/sage-adk" ./cmd/adk
          "$RUNNER_TEMP/sage-adk" version

  sealed-image-arm64:
    name: Sealed image runtime (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - name: Verify sealed image and measured native child
        run: |
          test "$(go env GOARCH)" = arm64
          go test -mod=readonly -race -timeout 3m -v ./core/capture ./core/toolhost ./core/guardimage ./core/guardchannel
      - name: Diagnose fixed native hop refusals
        if: ${{ !cancelled() }}
        run: python3 scripts/trace-native-hop.py

  approved-operation-lint:
    name: Approved operation lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: ./core/guardbinding ./core/guardcalculator ./core/guardimage ./core/guardchannel
      - name: Lint changed capture and native hop files
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --new-from-rev HEAD~ --whole-files ./core/capture ./core/toolhost
