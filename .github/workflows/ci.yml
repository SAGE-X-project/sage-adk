name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            verification/library-consumer/go.sum
      - name: Verify dependencies and build
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
      - name: Unit and safe loopback tests
        run: go test -mod=readonly -race -timeout 10m ./...
      - name: Protected A2A binding coverage and safe TLS fixture
        run: |
          go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/a2a-binding.cover" ./core/a2abinding
          python3 verification/a2a-basis/check_coverage.py "$RUNNER_TEMP/a2a-binding.cover"
      - name: Approved operation policy coverage
        run: |
          go test -mod=readonly -race -coverpkg=./core/guardbinding -coverprofile="$RUNNER_TEMP/approved-operation.cover" -timeout 2m ./core/guardbinding ./core/toolhost
          go tool cover -func="$RUNNER_TEMP/approved-operation.cover" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Compiled calculator binding coverage
        run: |
          go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/calculator-binding.cover" ./core/guardcalculator
          go tool cover -func="$RUNNER_TEMP/calculator-binding.cover" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 85) exit 1 } END { if (!found) exit 1 }'
      - name: Protected host assembly coverage
        run: |
          for pkg in guardhost guardsigner guardapproval; do
            go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/$pkg.cover" -timeout 5m "./core/$pkg"
            go tool cover -func="$RUNNER_TEMP/$pkg.cover" | awk -v pkg="$pkg" '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) { print pkg " coverage " $3 "% is below 90%"; exit 1 } } END { if (!found) exit 1 }'
          done
      - name: External library consumer
        working-directory: verification/library-consumer
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly -race -timeout 1m ./...
      - name: Retain public DID consumer evidence
        working-directory: verification/library-consumer
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          evidence="$RUNNER_TEMP/did-consumer"
          mkdir -p "$evidence"
          go version > "$evidence/go-version.txt"
          go list -m -json github.com/sage-x-project/sage github.com/sage-x-project/did-go github.com/sage-x-project/did-go/advanced/sage > "$evidence/modules.json"
          python3 - <<'PYMODULES'
          import json, os
          from pathlib import Path
          data = Path(os.environ['RUNNER_TEMP'], 'did-consumer/modules.json').read_text()
          decoder = json.JSONDecoder()
          selected = {}
          while data.strip():
              module, end = decoder.raw_decode(data.lstrip())
              data = data.lstrip()[end:]
              assert module['Path'] not in selected and not module.get('Replace')
              selected[module['Path']] = {key: module[key] for key in ('Version', 'Sum', 'GoModSum')}
          assert selected == json.loads(Path('did-dependencies.json').read_text())
          PYMODULES
          go mod verify > "$evidence/modules-verified.txt"
          go test -mod=readonly -race -count=1 -timeout 2m -json -run '^TestAdoptedDID' ./... | tee "$evidence/tests.jsonl"
          git diff --exit-code -- go.mod go.sum
          if [ "$RUNNER_OS" = Linux ]; then
            (cd ../.. && go test -mod=readonly -race -count=1 -timeout 2m -json -run '^TestMissingPrivateChannelRuntime$' ./core/guardchannel) | tee "$evidence/channel-refusal.jsonl"
          fi
      - name: Upload public DID consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: did-consumer-${{ matrix.os }}
          path: ${{ runner.temp }}/did-consumer/
          if-no-files-found: error
          retention-days: 14

      - name: CLI smoke check
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/sage-adk" ./cmd/adk
          "$RUNNER_TEMP/sage-adk" version

  sealed-image-arm64:
    name: Sealed image runtime (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - name: Verify sealed image and measured native child
        run: |
          test "$(go env GOARCH)" = arm64
          go test -mod=readonly -race -timeout 3m -v ./core/capture ./core/toolhost ./core/guardimage ./core/guardchannel

  approved-operation-lint:
    name: Approved operation lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: ./core/guardbinding ./core/guardcalculator ./core/guardimage ./core/guardchannel ./core/guardsigner ./cmd/adk-signer ./core/guardapproval ./cmd/adk-approve ./core/guardhost
      - name: Lint changed capture and native hop files
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --new-from-rev HEAD~ --whole-files ./core/capture ./core/toolhost
